<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>내 회사생활 등급은? – 출근 5분 후</title>

<meta name="theme-color" content="#2350B5">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕕</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E9EDF2; --surface:#FFFFFF; --ink:#1D2430; --muted:#5F6B7A; --line:#CBD3DD;
  --corp:#2350B5; --corp-ink:#FFFFFF; --stamp:#C8302B; --option:#F6F8FB; --option-hover:#E3EAF5; --warn:#B26A00;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#161B22; --surface:#212833; --ink:#E6EBF1; --muted:#9AA6B5; --line:#344050;
    --corp:#5B86E8; --corp-ink:#0F1622; --stamp:#F0605A; --option:#283140; --option-hover:#334055; --warn:#F0B44C;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#161B22; --surface:#212833; --ink:#E6EBF1; --muted:#9AA6B5; --line:#344050;
  --corp:#5B86E8; --corp-ink:#0F1622; --stamp:#F0605A; --option:#283140; --option-hover:#334055; --warn:#F0B44C;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);
  font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:520px;margin:0 auto;padding:24px 20px 56px}
.mono{font-family:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible{outline:3px solid var(--corp);outline-offset:3px}
.hidden{display:none!important}

.start{padding-top:6vh}
.day{font-size:16px;font-weight:600;color:var(--stamp);margin:0 0 4px}
.clock-big{font-size:clamp(72px,24vw,128px);font-weight:600;line-height:1;letter-spacing:-.02em;margin:0}
.clock-big .colon{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:.15}}
.start h1{font-size:30px;line-height:1.3;margin:26px 0 8px;font-weight:700}
.start p.lead{color:var(--muted);margin:0 0 26px}
.friend{background:var(--surface);border:1.5px dashed var(--stamp);border-radius:12px;padding:14px 16px;margin:0 0 22px;font-weight:500}
.friend b{color:var(--stamp)}
.primary{display:block;width:100%;border:0;border-radius:10px;padding:17px 20px;background:var(--corp);color:var(--corp-ink);font-weight:700;font-size:18px}
.primary:hover{filter:brightness(1.08)}
.secondary{display:block;width:100%;border:1.5px solid var(--line);border-radius:10px;padding:14px 20px;background:transparent;font-weight:500}
.secondary:hover{background:var(--option)}
.fine{font-size:14px;color:var(--muted);margin-top:16px}

/* 질문 화면: 두 개의 시계 */
.clocks{display:grid;grid-template-columns:1fr auto;align-items:end;gap:12px;margin-bottom:10px}
.clocks .lbl{display:block;font-size:13px;color:var(--muted);line-height:1.3}
.now{font-size:40px;font-weight:600;line-height:1.1}
.eta{text-align:right}
.eta .v{font-size:22px;font-weight:600;line-height:1.3;color:var(--stamp);display:inline-block}
.eta .v.bump{animation:bump .5s ease}
@keyframes bump{30%{transform:scale(1.25)}}
.track{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin:4px 0 28px}
.track i{display:block;height:100%;background:var(--muted);transition:width .35s ease}
.scene{color:var(--muted);margin:0 0 10px}
.line{font-size:23px;font-weight:700;line-height:1.4;margin:0 0 24px}
.opts{display:grid;gap:10px}
.opt{text-align:left;border:1.5px solid transparent;border-radius:10px;padding:15px 18px;background:var(--option);line-height:1.5}
.opt:hover{background:var(--option-hover)}
.opt:active{border-color:var(--corp)}
.react{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 18px 16px;animation:rise .25s ease both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
.react .picked{font-size:14px;color:var(--muted);margin:0 0 8px}
.react .rtext{font-size:19px;font-weight:700;line-height:1.5;margin:0 0 14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{font-size:14px;font-weight:600;border-radius:999px;padding:4px 12px;background:var(--option)}
.chip.late{color:var(--stamp)}
.chip.mon{color:var(--warn)}

/* 결과 */
.chime{text-align:center;margin:4px 0 18px;color:var(--muted);font-size:15px}
.chime b{color:var(--ink)}
.hero{text-align:center;margin-bottom:22px}
.hero .lbl{font-size:15px;color:var(--muted);margin:0}
.hero .time{font-size:clamp(76px,25vw,124px);font-weight:600;line-height:1.05;letter-spacing:-.03em;margin:2px 0 6px;color:var(--stamp)}
.hero .time small{font-size:.38em;letter-spacing:0}
.hero h2{font-size:24px;margin:0 0 6px}
.hero .edesc{margin:0 auto;max-width:28em;color:var(--ink)}
.rare{display:inline-block;font-size:13px;font-weight:700;color:var(--stamp);border:1.5px solid var(--stamp);border-radius:999px;padding:1px 10px;margin-bottom:8px}
.monday{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:10px;padding:12px 14px;margin:0 0 22px}
.monday p{margin:0}
.monday .lbl{font-size:13px;color:var(--muted)}
.badge{position:relative;background:var(--surface);border-radius:16px;overflow:hidden;border:1px solid var(--line);margin-bottom:22px}
.badge-top{background:var(--corp);color:var(--corp-ink);padding:22px 22px 18px}
.badge-top .slot{width:56px;height:10px;border-radius:5px;background:var(--paper);margin:0 auto 16px}
.badge-top .co{font-weight:700;font-size:15px}
.badge-top .co span{font-weight:400;opacity:.8;margin-left:6px}
.badge-body{padding:22px}
.idrow{display:flex;gap:18px;align-items:center;margin-bottom:16px}
.photo{flex:none;width:92px;height:112px;border-radius:8px;background:var(--option);display:grid;place-items:center;font-size:52px;border:1px solid var(--line)}
.idrow .label{font-size:13px;color:var(--muted);margin:0}
.idrow h3{font-size:25px;line-height:1.25;margin:2px 0 4px;padding-right:70px}
.sub{font-size:14px;color:var(--muted);margin:0}
.quote{font-size:19px;font-weight:700;line-height:1.45;margin:0 0 14px}
.desc{margin:0 0 18px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.split div{background:var(--option);border-radius:8px;padding:12px}
.split p{margin:0;font-size:13px;color:var(--muted)}
.split b{display:block;font-size:15px;margin-top:2px}
.caution{font-size:15px;margin:18px 0 0;padding-top:16px;border-top:1px dashed var(--line)}
.stamp{position:absolute;right:14px;top:62px;width:96px;height:96px;border-radius:50%;
  border:4px solid var(--stamp);color:var(--stamp);display:grid;place-content:center;
  font-weight:700;font-size:19px;line-height:1.15;text-align:center;transform:rotate(-14deg);
  opacity:.92;pointer-events:none;background:color-mix(in srgb,var(--surface) 60%,transparent);
  animation:stampIn .45s cubic-bezier(.2,1.6,.4,1) 1.3s both}
@keyframes stampIn{from{transform:rotate(-14deg) scale(2.4);opacity:0}to{transform:rotate(-14deg) scale(1);opacity:.92}}
.sendto{font-weight:500;margin:0 0 12px;text-align:center}
.actions{display:grid;gap:10px;margin-bottom:8px}
.toast{font-size:14px;color:var(--muted);text-align:center;min-height:1.6em;margin:4px 0 18px}
.shot{margin:0 0 26px;text-align:center}
.shot img{width:100%;max-width:400px;border-radius:12px;border:1px solid var(--line)}
.shot p{font-size:14px;color:var(--muted);margin:8px 0 0}
.collect{margin-bottom:26px}
.collect h4,.more h4{font-size:17px;margin:0 0 4px}
.note{font-size:14px;color:var(--muted);margin:0 0 12px}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.slotc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px}
.slotc b{display:block}
.slotc span{font-size:13px;color:var(--muted)}
.slotc.locked{background:transparent;border-style:dashed;color:var(--muted)}
details{border-top:1px solid var(--line);padding-top:14px;margin-top:6px}
summary{cursor:pointer;font-weight:700;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";float:right;color:var(--muted);font-weight:400}
details[open] summary::after{content:"−"}
.more{margin-top:16px}
.dist{display:grid;gap:8px;margin-bottom:22px}
.dist-row{display:grid;grid-template-columns:132px 1fr 44px;gap:10px;align-items:center;font-size:14px}
.dist-row .bar{height:8px;border-radius:4px;background:var(--option);overflow:hidden}
.dist-row .bar i{display:block;height:100%;background:var(--muted)}
.dist-row.me .bar i{background:var(--stamp)}
.dist-row.me{font-weight:700}
.dist-row .pct{text-align:right}
.types{display:grid;gap:8px}
.type-item{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;background:var(--surface);border-radius:10px;border:1px solid var(--line)}
.type-item .e{font-size:26px;line-height:1.2}
.type-item b{display:block}
.type-item span{font-size:14px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.opt.sel{border-color:var(--corp)}
.hero h2,.idrow h3,.quote{word-break:keep-all}
</style>
</head>
<body>
<main class="wrap">

  <section id="start" class="start">
    <p class="day">출근 5분 후 · 잠깐 쉬어가기</p>
    <p class="clock-big mono" aria-hidden="true">09<span class="colon">:</span>05</p>
    <h1>내 회사생활 등급은?</h1>

  </section>

  <section id="quiz" class="hidden">

    </div>

    <p class="fine"><button class="secondary" id="backBtn" style="padding:6px 14px">← 이전 질문</button></p>
  </section>

  <section id="result" class="hidden">
    <div class="hero">
      <p class="lbl">나의 회사생활 등급</p>

      <div class="badge-body">
        <div class="idrow">

            <p class="sub" id="rSub"></p>
          </div>
        </div>
        <p class="quote" id="rQuote"></p>
        <p class="desc" id="rDesc"></p>
        <div class="split">
          <div><p>상사가 보는 나</p><b id="rBoss"></b></div>
          <div><p>퇴근 직전의 나</p><b id="rEnd"></b></div>
        </div>
        <p class="caution" id="rMate"></p>
      </div>
    </article>

    <div class="actions">
      <button class="primary" id="copyBtn">친구에게 결과 공유하기</button>
      <button class="secondary" id="againBtn">다시 해 보기</button>
      <a class="secondary" href="./" style="text-align:center;text-decoration:none;color:var(--ink)">출근 5분 후 홈으로</a>
    </div>
    <p class="toast" id="toast" role="status"></p>

    <details>
      <summary>자세한 결과 보기</summary>
      <div class="more">
        <h4>유형별 싱크로율</h4>
        <p class="note">내 선택이 각 유형과 얼마나 닮았는지 보여 줘요.</p>
        <div class="dist" id="dist"></div>
        <h4>모든 유형</h4>
        <div class="types" id="types"></div>
      </div>
    </details>
  </section>
</main>

 S:{grade:"S급",name:"프로 일잘러형",emoji:"🚀",line:"일이 오면 일단 끝내 놓고 생각합니다",

 A:{grade:"A급",name:"조용한 실세형",emoji:"🕶️",line:"말은 적지만, 없으면 바로 티가 납니다",

/* ===== 채점: 선택한 행동 성향을 합산하고, 유형마다 얻을 수 있는 최대 점수 대비 비율(싱크로율)이 가장 높은 유형으로 분류 ===== */
function score(ans){const sc={},pr={};ORDER.forEach(k=>{sc[k]=0;pr[k]=0;});
 ans.forEach((a,i)=>{const o=QS[i].o[a];sc[o.p]+=2;pr[o.p]++;if(o.s)sc[o.s]+=1;});return{sc,pr};}
function classify(ans){const{sc,pr}=score(ans);
 // 동점이면: 주 성향으로 고른 횟수 → 마지막 질문들에서 가까운 쪽(최근 선택) 순으로 결정
 const recent=k=>{for(let i=ans.length-1;i>=0;i--)if(QS[i].o[ans[i]].p===k)return i;return -1;};
 return ORDER.slice().sort((x,y)=>sc[y]/MAX[y]-sc[x]/MAX[x]||pr[y]-pr[x]||recent(y)-recent(x))[0];}
const MAX=(()=>{const m={};ORDER.forEach(k=>m[k]=QS.reduce((s,q)=>s+Math.max(...q.o.map(o=>(o.p===k?2:0)+(o.s===k?1:0))),0));return m;})();
/* ===== 화면 ===== */
const $=id=>document.getElementById(id);
const SHARE_BASE=location.origin+location.pathname;
let ans=[],qi=0,last=null;
function show(id){["start","quiz","result"].forEach(s=>$(s).classList.toggle("hidden",s!==id));scrollTo({top:0});}
function begin(){ans=[];qi=0;show("quiz");renderQ();}
function renderQ(){const q=QS[qi];$("qNo").textContent=(qi+1)+" / "+QS.length;$("qTrack").style.width=(qi/QS.length*100)+"%";
 $("qScene").textContent=q.scene;$("qLine").textContent=q.line;$("backBtn").style.visibility=qi?"visible":"hidden";
 $("qOpts").innerHTML=q.o.map((o,i)=>'<button class="opt" data-i="'+i+'">'+esc(o.t)+'</button>').join("");}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function choose(i){ans[qi]=i;qi++;if(qi<QS.length)renderQ();else finish();}
function finish(){$("qTrack").style.width="100%";const k=classify(ans);last=k;
 try{const s=JSON.parse(localStorage.getItem("company_grade_v1")||"{}");s.last=k;s.count=(s.count||0)+1;localStorage.setItem("company_grade_v1",JSON.stringify(s));}catch(e){}
 renderResult(k,score(ans).sc);show("result");}
function renderResult(k,sc){const T=TYPES[k];
 $("rGrade").textContent=T.grade;$("rName").textContent=T.emoji+" "+T.name;$("rLine").textContent=T.line;
 $("rEmoji").textContent=T.emoji;$("rType").textContent=T.name;$("rSub").textContent=T.grade+" 사원";
 $("rQuote").textContent=T.quote;$("rDesc").textContent=T.desc;$("rBoss").textContent=T.boss;$("rEnd").textContent=T.end;
 const M=TYPES[T.mate];$("rMate").textContent="잘 맞는 동료: "+M.grade+" "+M.name+" "+M.emoji+" — "+T.mateWhy;
 const st=$("stamp");st.textContent=T.grade;st.style.animation="none";void st.offsetWidth;st.style.animation="";
 $("dist").innerHTML=sc?ORDER.map(x=>{const p=Math.round(sc[x]/MAX[x]*100);return '<div class="dist-row'+(x===k?' me':'')+'"><span>'+TYPES[x].grade+' '+TYPES[x].name+'</span><span class="bar"><i style="width:'+p+'%"></i></span><span class="pct">'+p+'%</span></div>';}).join(""):"";
 $("types").innerHTML=ORDER.map(x=>'<div class="type-item"><span class="e">'+TYPES[x].emoji+'</span><div><b>'+TYPES[x].grade+' '+TYPES[x].name+'</b><span>'+esc(TYPES[x].line)+'</span></div></div>').join("");}
function shareText(k){const T=TYPES[k];return "[내 회사생활 등급은?]\n나는 "+T.grade+" "+T.name+" "+T.emoji+"\n"+T.quote+"\n상사가 보는 나: "+T.boss+"\n너는 몇 급이야? 👉 "+SHARE_BASE+"?r="+k;}
function copyResult(){const t=shareText(last),toast=$("toast");const ok=()=>{toast.textContent="결과를 복사했어요. 친구에게 붙여 넣어 보내 보세요.";};
 if(navigator.share&&matchMedia("(pointer:coarse)").matches){navigator.share({title:"내 회사생활 등급은?",text:t}).catch(()=>{});return;}
 if(navigator.clipboard)navigator.clipboard.writeText(t).then(ok,()=>prompt("아래 내용을 복사하세요",t));else prompt("아래 내용을 복사하세요",t);}
$("startBtn").onclick=begin;$("againBtn").onclick=begin;$("copyBtn").onclick=copyResult;
$("backBtn").onclick=()=>{if(qi>0){qi--;renderQ();}};
$("qOpts").addEventListener("click",e=>{const b=e.target.closest(".opt");if(b)choose(+b.dataset.i);});
(()=>{const r=new URLSearchParams(location.search).get("r");if(r&&TYPES[r]){const f=$("friend");f.innerHTML="친구의 결과는 <b>"+TYPES[r].grade+" "+TYPES[r].name+" "+TYPES[r].emoji+"</b>. 당신은 몇 급일까요?";f.classList.remove("hidden");}})();
</script>

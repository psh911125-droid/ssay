<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>안개등 여관 — 출근 5분 후</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--hb-line:#5b6670;--hb-bg:rgba(255,255,255,.07);--hb-ink:#efe7d6;--night:#1b2128;--fog:#2a323b;--lamp:#e2a23b;--lampdim:#9c7330;--paper:#e9e3d4;--paper2:#ddd5c1;--ink:#2a2620;--sub:#6e665a;--rule:#b8ad94;--x:#a3473a;--o:#2b6a5d;--mist:#aeb6bc;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--night) radial-gradient(ellipse 70% 40% at 50% -5%,#4a3a20 0%,transparent 70%) no-repeat;color:#efe7d6;font:15px/1.6 "Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",system-ui,sans-serif;min-height:100vh}
a{color:var(--lamp)}
button,select{font:inherit}
button:focus-visible,select:focus-visible,.cell:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding:18px 16px 60px}
.top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mist)}
.top a{color:var(--mist);text-decoration:none}
header{text-align:center;margin:26px 0 22px}
h1{font-family:"Noto Serif KR",Batang,serif;font-weight:700;font-size:40px;letter-spacing:-1px;margin:0;color:#f6ecd6}
h1::before{content:"";display:block;width:10px;height:10px;margin:0 auto 14px;border-radius:50%;background:var(--lamp);box-shadow:0 0 18px 6px rgba(226,162,59,.45)}
.tag{color:var(--mist);margin:6px 0 0}
.meta{margin-top:12px;font-size:13.5px;color:#d9cfbb}
.meta .pill{display:inline-block;border:1px solid var(--lampdim);color:var(--lamp);border-radius:99px;padding:1px 10px;margin-left:6px}
.card{background:var(--paper);color:var(--ink);border-radius:4px;padding:18px 20px;margin:0 0 16px;box-shadow:0 10px 30px rgba(0,0,0,.35)}

.story{background:transparent;color:#e6dcc7;box-shadow:none;border:1px solid #3d4650;padding:14px 18px}
.story b{color:var(--lamp);font-weight:600}
.muted{color:var(--sub);font-size:13.5px}
details summary{cursor:pointer;color:var(--sub);font-size:13.5px}
ol.clues{margin:0;padding-left:26px}
ol.clues li{padding:4px 2px;cursor:pointer;border-bottom:1px dashed var(--rule)}
ol.clues li:last-child{border-bottom:0}
ol.clues li.done{color:#a39985;text-decoration:line-through}
.gtool{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:0 0 10px}
.pen{display:inline-flex;border:1px solid var(--ink);border-radius:6px;overflow:hidden}
.pen button{min-width:76px;min-height:42px;border:0;background:#f6f1e6;color:var(--ink);font-size:15px;cursor:pointer;padding:4px 12px}

.gwrap{overflow:auto;max-height:76vh;border:1px solid var(--rule);background:var(--paper);-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
table.lg{border-collapse:separate;border-spacing:0;margin:0;font-size:13px}
table.lg th{font-weight:600;color:var(--ink);background:var(--paper);padding:0 4px;line-height:1.2}
table.lg thead th{position:sticky;z-index:2}
table.lg tr.gh th{top:0;height:24px;font-size:12px;color:var(--sub);font-weight:600;border-bottom:1px solid var(--rule)}
table.lg tr.ch th{top:24px;height:40px;font-size:12px;letter-spacing:-.3px;white-space:nowrap;text-align:center;vertical-align:middle;border-bottom:2px solid #6d6150;min-width:36px}
table.lg th.corner{left:0;top:0;z-index:4;text-align:left;vertical-align:bottom;padding:4px 8px;border-bottom:2px solid #6d6150;border-right:2px solid #6d6150}

.cell{width:36px;min-width:36px;height:34px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);background:#f4efe3;text-align:center;cursor:pointer;font-size:17px;user-select:none;-webkit-tap-highlight-color:transparent}
.cell.hx{box-shadow:inset 0 0 0 99px rgba(226,162,59,.16)}
.cell.x{color:var(--x)}.cell.xa{opacity:.5}.cell.o{color:var(--o);font-weight:700;background:#e3ecdf}
.bl{border-left:2px solid #6d6150!important}.bt{border-top:2px solid #6d6150!important}
td.void{background:var(--paper)}

.memo{display:flex;flex-direction:column;gap:4px;font-size:13.5px;font-weight:600;color:var(--sub)}
.memo textarea{width:100%;min-height:92px;resize:vertical;border:1px solid var(--rule);border-radius:4px;background:#f6f1e6;color:var(--ink);padding:8px 10px;font:inherit;font-size:16px;font-weight:400;line-height:1.5}

.opt{margin:0 0 8px}
.final{border-top:6px solid var(--ink)}.pill2{display:inline-block;font-family:inherit;font-size:12px;font-weight:700;background:var(--ink);color:var(--paper);border-radius:99px;padding:1px 9px;vertical-align:middle;margin-left:4px}

.rule{margin:4px 0 8px}
.nav{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}
.btn.ghost{border-color:#5b6670;color:#d9cfbb}.btn.sm{padding:3px 10px;margin-left:6px}
.lvlist{display:grid;gap:8px;margin-top:6px}
.lv{display:grid;grid-template-columns:1fr auto;grid-template-areas:"n s" "d a";gap:2px 12px;text-align:left;border:1px solid var(--rule);background:#f6f1e6;color:var(--ink);border-radius:4px;padding:10px 14px;cursor:pointer;font:inherit}
.lv:hover{border-color:var(--ink)}
.lvn{grid-area:n;font-weight:700}.lvd{grid-area:d;color:var(--sub);font-size:13px}.lvs{grid-area:s;justify-self:end;font-size:13px;border-radius:99px;padding:0 10px;border:1px solid var(--rule)}.lva{grid-area:a;justify-self:end;font-size:13px;color:var(--sub)}

.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btn{border:1px solid var(--ink);background:transparent;color:var(--ink);padding:7px 14px;border-radius:3px;cursor:pointer}
.btn.main{background:var(--ink);color:var(--paper)}
.btn.lamp{background:var(--lamp);border-color:var(--lamp);color:#22190a}
.msg{margin-top:12px;padding:8px 12px;border-left:3px solid var(--x);background:#efe3d8}
.solved{border-top:6px solid var(--lamp)}
.solved .end{font-family:"Noto Serif KR",Batang,serif;font-size:17px;margin:4px 0 12px}

@media (max-width:560px){h1{font-size:32px}.wrap{padding-left:10px;padding-right:10px}.card{padding:16px 12px}.cell{width:32px;min-width:32px;height:32px;font-size:15px}table.lg tr.ch th{min-width:32px;font-size:11px;padding:0 1px}table.lg th.rl{white-space:normal;word-break:keep-all;min-width:4.6em;max-width:5em;font-size:12px;padding:0 5px}.gwrap{max-height:70vh}}
/* 메인으로 버튼(공통 규격: 집 아이콘+글자, 최소 44×44, 주소로 직접 이동) */
.home-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--hb-line,var(--line,#d6dccd));background:var(--hb-bg,var(--surface,#fff));color:var(--hb-ink,var(--ink,#1f2a22));font:700 14px/1 "Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;text-decoration:none;white-space:nowrap;cursor:pointer}
.home-btn svg{width:18px;height:18px;flex:none}.home-btn:hover{filter:brightness(.97)}

<body>
<div class="wrap">
  <div class="top"><span id="today"></span><a class="home-btn" href="./" data-home><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5.5 10v9.5h5v-5.5h3v5.5h5V10" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></svg><span>메인으로</span></a></div>
  <div id="app"></div>
  <p class="foot">문제는 날짜마다 자동으로 만들어지고, 답이 하나뿐인지 검증된 것만 나옵니다.</p>
</div>
<script src="inn-data.js"></script>
<script>
const D=window.INN_DATA;
/* ===== 유틸 ===== */
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function rng(seed){let a=seed>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const shuffle=(a,r)=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const pick=(a,r)=>a[Math.floor(r()*a.length)];
const range=n=>[...Array(n).keys()];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function batchim(w){const ch=w.trim().slice(-1);const c=ch.charCodeAt(0);if(c>=0xAC00&&c<=0xD7A3)return(c-0xAC00)%28!==0;if(/[0-9]/.test(ch))return'0136780'.includes(ch);return false;}
const JOSA={'은':['은','는'],'이':['이','가'],'을':['을','를'],'와':['과','와'],'이었':['이었','였']};
function fmt(t,m){return t.replace(/\{([A-Z])(?::([^}]+))?\}/g,(_,k,j)=>{const w=m[k]??'';return j?w+JOSA[j][batchim(w)?0:1]:w;});}
function kstDate(){try{const s=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;}catch(e){}return new Date(Date.now()+9*3600e3).toISOString().slice(0,10);}
const parseD=ds=>{const[y,m,d]=ds.split('-').map(Number);return new Date(Date.UTC(y,m-1,d));};
const dow=ds=>parseD(ds).getUTCDay();
const addDays=(ds,n)=>{const d=parseD(ds);d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);};
function epNo(ds){if(ds<D.launchDate)return 0;let n=0,d=D.launchDate,g=0;while(d<=ds&&g++<4000){const w=dow(d);if(w>0&&w<6)n++;d=addDays(d,1);}return n;}
const koDate=ds=>{const d=parseD(ds);return(d.getUTCMonth()+1)+'월 '+d.getUTCDate()+'일('+'일월화수목금토'[d.getUTCDay()]+')';};

/* ===== 퍼즐 생성 ===== */
const LEVEL={1:{n:4,extra:2,w:{same:5,diff:2,cmp:2,adj:1,cmpc:1}},2:{n:4,extra:1,w:{same:3,diff:3,cmp:3,adj:2,cmpc:1}},3:{n:5,extra:1,w:{same:3,diff:3,cmp:3,adj:2,cmpc:1}},4:{n:5,extra:0,w:{same:2,diff:4,cmp:3,adj:2,cmpc:2}},5:{n:6,extra:0,w:{same:2,diff:4,cmp:3,adj:3,cmpc:2}}};
const ORD=['P','R','T','I'];
const entAt=(c,p,sol)=>({c,v:c==='P'?p:sol[c][p]});
function candidates(P,r){const{n,sol}=P,o={same:[],diff:[],cmp:[],adj:[],cmpc:[]};
 for(const[c1,c2]of[['P','R'],['P','T'],['P','I'],['R','T'],['R','I'],['T','I']]){
  for(let p=0;p<n;p++)o.same.push({k:'same',a:entAt(c1,p,sol),b:entAt(c2,p,sol)});
  for(let p=0;p<n;p++)for(let q=0;q<n;q++)if(p!==q)o.diff.push({k:'diff',a:entAt(c1,p,sol),b:entAt(c2,q,sol)});}
 for(const K of['T','R']){const oth=ORD.filter(c=>c!==K);
  for(let p=0;p<n;p++)for(let q=0;q<n;q++){if(p===q)continue;const x=sol[K][p],y=sol[K][q];
   if(x<y)o.cmp.push({k:'lt',K,a:entAt(pick(oth,r),p,sol),b:entAt(pick(oth,r),q,sol),flip:r()<.5});
   if(y-x===1)o.adj.push({k:K==='T'?'next':'adj',K,a:entAt(pick(oth,r),p,sol),b:entAt(pick(oth,r),q,sol)});}
  for(let p=0;p<n;p++)for(let c=sol[K][p]+1;c<n;c++)if(c>sol[K][p]+1||r()<.5)o.cmpc.push({k:'ltc',K,a:entAt(pick(oth,r),p,sol),c});}
 return o;}
function poolOrder(o,w,r){const b={};for(const k in o)b[k]=shuffle(o[k],r);const out=[];
 for(;;){const ks=Object.keys(b).filter(k=>b[k].length&&w[k]);if(!ks.length)break;let tot=ks.reduce((s,k)=>s+w[k],0),x=r()*tot,k=ks[0];for(const kk of ks){x-=w[kk];if(x<0){k=kk;break;}}out.push(b[k].pop());}
 return out;}
function countSol(P,clues,limit,budget=150000){let nodes=0;const n=P.n,A={R:Array(n).fill(-1),T:Array(n).fill(-1),I:Array(n).fill(-1)},inv={R:Array(n).fill(-1),T:Array(n).fill(-1),I:Array(n).fill(-1)};
 const row=e=>e.c==='P'?e.v:inv[e.c][e.v],val=(p,c)=>c==='P'?p:A[c][p];
 const at=(e,K)=>{if(e.c===K)return e.v;const p=row(e);return p>=0?A[K][p]:-1;};
 const ok=k=>{switch(k.k){
  case'same':case'diff':{const pa=row(k.a),pb=row(k.b),s=k.k==='same';if(pa>=0&&pb>=0)return(pa===pb)===s;if(pa>=0){const v=val(pa,k.b.c);if(v>=0)return(v===k.b.v)===s;}if(pb>=0){const v=val(pb,k.a.c);if(v>=0)return(v===k.a.v)===s;}return true;}
  case'lt':{const x=at(k.a,k.K),y=at(k.b,k.K);return x<0||y<0||x<y;}
  case'next':{const x=at(k.a,k.K),y=at(k.b,k.K);return x<0||y<0||y-x===1;}
  case'adj':{const x=at(k.a,k.K),y=at(k.b,k.K);return x<0||y<0||Math.abs(x-y)===1;}
  case'ltc':{const x=at(k.a,k.K);return x<0||x<k.c;}}};
 const cs=k=>{const s=new Set([k.a.c,k.b?k.b.c:'P',k.K||'P']);s.delete('P');return s;};
 const sets=clues.map(cs),perm=[['R','T','I'],['R','I','T'],['T','R','I'],['T','I','R'],['I','R','T'],['I','T','R']];
 let best=perm[0],bs=-1;for(const o of perm){let sc=0;for(const s of sets){const need=[...s].reduce((m,c)=>Math.max(m,o.indexOf(c)),0);sc+=(3-need)*(3-need);}if(sc>bs){bs=sc;best=o;}}
 const by={};for(const c of best)by[c]=clues.filter((k,i)=>sets[i].has(c));
 const deg=Array(n).fill(0);for(const k of clues){if(k.a.c==='P')deg[k.a.v]++;if(k.b&&k.b.c==='P')deg[k.b.v]++;}
 const pord=range(n).sort((x,y)=>deg[y]-deg[x]);
 const order=[];for(const c of best)for(const p of pord)order.push([c,p]);
 let cnt=0;(function go(i){if(cnt<0)return;if(++nodes>budget){cnt=-1;return;}if(i===order.length){cnt++;return;}const[c,p]=order[i],L=by[c];
  for(let v=0;v<n;v++){if(inv[c][v]>=0)continue;A[c][p]=v;inv[c][v]=p;let good=true;for(const k of L)if(!ok(k)){good=false;break;}if(good)go(i+1);A[c][p]=-1;inv[c][v]=-1;if(cnt>=limit||cnt<0)return;}})(0);
 return cnt;}
function generate(seed,lv){const L=LEVEL[lv],n=L.n;
 for(let t=0;t<30;t++){const r=rng(hash(seed+'#'+t));
  const P={n,lv,people:shuffle(range(D.people.length),r).slice(0,n).sort((a,b)=>a-b),rs:Math.floor(r()*(D.cats.R.values.length-n+1)),ts:Math.floor(r()*(D.cats.T.values.length-n+1)),items:shuffle(range(D.cats.I.values.length),r).slice(0,n).sort((a,b)=>a-b)};
  P.sol={R:shuffle(range(n),r),T:shuffle(range(n),r),I:shuffle(range(n),r)};
  const cand=candidates(P,r),pool=poolOrder(cand,L.w,r),ch=[];let i=0,u=0;
  while(i<pool.length){ch.push(pool[i++]);if(ch.length>=n){u=countSol(P,ch,2);if(u===1)break;}}
  if(u!==1)continue;
  for(const k of shuffle(ch,r)){const rest=ch.filter(x=>x!==k);if(countSol(P,rest,2)===1)ch.splice(ch.indexOf(k),1);}
  const spare=shuffle(cand.same.filter(x=>!ch.includes(x)),r);for(let e=0;e<L.extra&&e<spare.length;e++)ch.push(spare[e]);
  P.clues=shuffle(ch,r);P.endRow=Math.floor(r()*n);P.endT=Math.floor(r()*D.endings.length);return P;}
 return null;}

/* ===== 문장 ===== */
function label(c,v,P,short){if(c==='P')return D.people[P.people[v]].name;if(c==='R')return D.cats.R.values[P.rs+v];if(c==='T')return D.cats.T.values[P.ts+v][short?0:1];return D.cats.I.values[P.items[v]];}
const subj=(e,P)=>fmt(D.subj[e.c],{[e.c]:label(e.c,e.v,P)});
function clueText(k,P){
 if(k.k==='same'||k.k==='diff'){let a=k.a,b=k.b;if(ORD.indexOf(a.c)>ORD.indexOf(b.c))[a,b]=[b,a];return fmt(D.clue[k.k][a.c+b.c],{[a.c]:label(a.c,a.v,P),[b.c]:label(b.c,b.v,P)});}
 const A=subj(k.a,P),B=k.b?subj(k.b,P):'';
 if(k.k==='lt'){const t=k.K==='T'?(k.flip?D.clue.later:D.clue.earlier):(k.flip?D.clue.roomHigher:D.clue.roomLower);return k.flip?fmt(t,{A:B,B:A}):fmt(t,{A,B});}
 if(k.k==='next')return fmt(D.clue.nextT,{A,B});
 if(k.k==='adj')return fmt(D.clue.adjR,{A,B});
 return fmt(k.K==='T'?D.clue.earlierC:D.clue.roomLowerC,{A,[k.K]:label(k.K,k.c,P)});}
function ending(P){const p=P.endRow;return fmt(D.endings[P.endT],{P:label('P',p,P),R:label('R',P.sol.R[p],P),T:label('T',P.sol.T[p],P),I:label('I',P.sol.I[p],P)});}

/* ===== 날짜·난이도 ===== */
const LVNAME={1:'입문',2:'쉬움',3:'보통',4:'어려움',5:'매우 어려움'};
const KN={4:'네',5:'다섯',6:'여섯'};
const QS=new URLSearchParams(location.search);
const PREVIEW=(()=>{const d=QS.get('date')||'';return /^\d{4}-\d{2}-\d{2}$/.test(d)&&addDays(d,0)===d?d:null;})(); // 개발자 미리보기(기록 저장 안 함)
let TODAY=PREVIEW||kstDate();
/* 기존(평일·요일=난이도) 문제는 예전 시드를 그대로 써서 같은 문제가 나오게 한다 */
const seedFor=(ds,lv)=>dow(ds)===lv?'inn-'+ds:'inn-'+ds+'-L'+lv;
const dayNo=ds=>ds<D.launchDate?0:Math.round((parseD(ds)-parseD(D.launchDate))/864e5)+1;

/* ===== 저장 =====
   inn_v2: {v:2, days:{'YYYY-MM-DD':{'1'..'5':{marks,done,ans,tries,solved,ms,rec,intro}}}}
   inn_v1(예전 평일 기록)은 지우지 않고, 같은 날짜·같은 난이도(=그날 요일)로만 읽어 온다. */
const KEY='inn_v2',OLD='inn_v1',UI='inn_ui';
function loadAll(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.days)return s;}catch(e){}return{v:2,days:{}};}
function fromOld(ds,lv){if(dow(ds)!==lv)return null;let o=null;try{o=(JSON.parse(localStorage.getItem(OLD))||{}).days;o=o&&o[ds];}catch(e){}if(!o)return null;
 const e={marks:o.marks||{},done:o.done||{},ans:o.ans||{},tries:o.tries||0,solved:!!o.solved,ms:o.ms||0,from:'v1'};if(e.solved)e.rec={ms:e.ms,tries:e.tries};return e;}
function getEntry(ds,lv){const s=loadAll();return(s.days[ds]&&s.days[ds][lv])||fromOld(ds,lv);}
function putEntry(ds,lv,e){try{const s=loadAll();(s.days[ds]=s.days[ds]||{})[lv]=e;localStorage.setItem(KEY,JSON.stringify(s));}catch(x){}}
function statusOf(e){if(!e)return'new';if(e.rec||e.solved)return'done';
 if(Object.keys(e.marks||{}).length||Object.values(e.ans||{}).some(v=>v!==''&&v!=null)||Object.values(e.done||{}).some(Boolean)||e.tries)return'going';return'new';}
/* 추리 메모: 정답·추리표와 완전히 별개. inn_memo_v1 = {날짜:{난이도:{PR,PT,PI,RT,RI,TI}}} */
const MEMOKEY='inn_memo_v1',MEMOS=[['PR','직원 × 객실'],['PT','직원 × 시간'],['PI','직원 × 분실물'],['RT','객실 × 시간'],['RI','객실 × 분실물'],['TI','시간 × 분실물']];
function memoLoad(ds,lv){try{const m=JSON.parse(localStorage.getItem(MEMOKEY))||{};return Object.assign({},(m[ds]||{})[lv]||{});}catch(e){return{};}}
function memoSave(){if(ST.mode!=='daily'||!ST.P)return;try{const m=JSON.parse(localStorage.getItem(MEMOKEY))||{};(m[ST.date]=m[ST.date]||{})[ST.lv]=ST.memo;localStorage.setItem(MEMOKEY,JSON.stringify(m));}catch(e){}}
function uiLoad(){try{return JSON.parse(localStorage.getItem(UI))||{};}catch(e){return{};}}
function uiSave(o){try{localStorage.setItem(UI,JSON.stringify(Object.assign(uiLoad(),o)));}catch(e){}}
function save(){if(ST.mode!=='daily'||!ST.P)return;const e={marks:ST.marks,done:ST.done,ans:ST.ans,tries:ST.tries,solved:ST.solved,ms:elapsed(),intro:ST.intro};if(ST.rec)e.rec=ST.rec;putEntry(ST.date,ST.lv,e);}

/* 만든 장부는 그날 하루 동안 이 브라우저에 보관(5단계는 만들 때 시간이 걸릴 수 있음). 내용은 시드로 다시 만든 것과 같다. */
const CACHE='inn_cache',ENGINE='e1';
function genCached(seed,lv,ds){let c=null;try{c=JSON.parse(localStorage.getItem(CACHE));}catch(e){}
 if(!c||c.d!==ds||c.e!==ENGINE)c={d:ds,e:ENGINE,p:{}};const hit=c.p[seed];if(hit&&hit.lv===lv&&hit.clues&&hit.sol)return hit;
 const P=generate(seed,lv);if(P){c.p[seed]=P;try{localStorage.setItem(CACHE,JSON.stringify(c));}catch(e){}}return P;}

/* ===== 상태 ===== */
const ST={mode:PREVIEW?'preview':'daily',view:'select',date:TODAY,lv:1,P:null,seed:'',marks:{},done:{},ans:{},tries:0,solved:false,ms:0,t0:null,msg:'',rec:null,intro:true,memo:{},gridOpen:false,pen:uiLoad().pen==='o'?'o':'x',hl:null,newDay:false};
const elapsed=()=>ST.ms+(ST.t0&&!ST.solved?Date.now()-ST.t0:0);
const startClock=()=>{if(!ST.t0&&!ST.solved)ST.t0=Date.now();};
const BLANK=()=>({marks:{},done:{},ans:{},tries:0,solved:false,ms:0,t0:null,msg:'',rec:null,hl:null});
function loading(){document.getElementById('app').innerHTML=`<header><h1>${esc(D.title)}</h1><p class="tag">뒤섞인 장부를 펼치는 중…</p></header>`;}
function toSelect(){if(ST.view==='play')save();ST.view='select';ST.P=null;ST.newDay=false;ST.mode=PREVIEW?'preview':'daily';ST.date=TODAY;render();scrollTo({top:0});}
function openLevel(lv){ST.lv=lv;ST.date=TODAY;ST.mode=PREVIEW?'preview':'daily';loading();scrollTo({top:0});
 setTimeout(()=>{ST.seed=seedFor(ST.date,lv);ST.P=genCached(ST.seed,lv,ST.date);
  if(!ST.P){document.getElementById('app').innerHTML='<div class="card"><p>장부를 만들지 못했습니다. 새로고침해 주세요.</p></div>';return;}
  const e=getEntry(ST.date,lv);Object.assign(ST,BLANK());
  if(e)Object.assign(ST,{marks:e.marks||{},done:e.done||{},ans:e.ans||{},tries:e.tries||0,solved:!!e.solved,ms:e.ms||0,rec:e.rec||null});
  ST.intro=e&&'intro' in e?!!e.intro:statusOf(e)==='new';ST.memo=memoLoad(ST.date,lv);ST.gridOpen=false;
  ST.view='play';if(e&&e.from==='v1')save();render();},40);}
function startPractice(){if(ST.view==='play')save();ST.mode='practice';ST.lv=3;loading();scrollTo({top:0});
 setTimeout(()=>{ST.seed='practice-'+Date.now();ST.P=generate(ST.seed,3);Object.assign(ST,BLANK());ST.intro=true;ST.memo={};ST.gridOpen=false;ST.view='play';render();},40);}
function replay(){if(!confirm('표와 장부를 비우고 다시 풀까요?\n처음 완료한 기록은 그대로 남습니다.'))return;const rec=ST.rec;Object.assign(ST,BLANK());ST.rec=rec;save();render();scrollTo({top:0});}

/* ===== 도입부 이야기 ===== */
function storyHTML(P){const S=D.story;if(!S)return`<p>${esc(D.intro)}</p>`;const r=rng(hash('story|'+ST.seed));const n=P.n;
 const names=range(n).map(p=>label('P',p,P)),items=range(n).map(v=>label('I',v,P));
 const facts=S.facts.replace(/\{NAMES\}/g,names.join(', ')).replace(/\{N\}/g,KN[n]||n).replace('{F}',label('T',0,P)).replace('{L}',label('T',n-1,P))
  .replace('{R1}',label('R',0,P)).replace('{R2}',label('R',n-1,P)).replace('{ITEMS}',items.slice(0,-1).join(', ')+', '+fmt('{I:이}',{I:items[n-1]}));
 const who=shuffle(range(n),r).slice(0,2).map(p=>{const v=D.people[P.people[p]].voices;return v?fmt(pick(v,r),{P:names[p]}):'';}).filter(Boolean);
 const ps=[pick(S.scene,r)+' '+pick(S.incident,r),facts,(S.testimony?pick(S.testimony,r)+' ':'')+who.join(' '),pick(S.request,r)];
 return ps.map(t=>`<p>${esc(t)}</p>`).join('')+`<p class="lead">${esc(pick(S.lead,r))}</p>`;}

/* ===== 추리 표 ===== */
const CN={R:'gR',T:'gT',I:'gI',P:'gP'};
function headTxt(c,v,P){const t=esc(label(c,v,P,1));return c==='I'?t.replace(' ','<br>'):t;}
function gridHTML(P){const n=P.n,cols=[['R',n],['T',n],['I',n]],rows=[['P',['R','T','I']],['I',['R','T']],['T',['R']]];
 let h=`<div class="gtool"><span class="pen" role="group" aria-label="표시 도구"><button data-pen="x" class="${ST.pen==='x'?'on':''}" aria-pressed="${ST.pen==='x'}">✕ 아님</button><button data-pen="o" class="${ST.pen==='o'?'on':''}" aria-pressed="${ST.pen==='o'}">○ 맞음</button></span><span class="muted">같은 칸을 한 번 더 누르면 지워집니다.</span></div>`;
 h+='<div class="gwrap"><table class="lg"><thead><tr class="gh"><th class="corner" rowspan="2"></th>'+cols.map(([c],ci)=>`<th class="grp ${CN[c]}${ci?' bl':''}" colspan="${n}">${D.cats[c].label}</th>`).join('')+'</tr><tr class="ch">';
 cols.forEach(([c],ci)=>range(n).forEach(v=>h+=`<th class="col ${CN[c]}${v===0&&ci?' bl':''}" data-col="${c}${v}">${headTxt(c,v,P)}</th>`));h+='</tr></thead><tbody>';
 rows.forEach(([rc,cc],ri)=>range(n).forEach(rv=>{h+=`<tr><th class="rl ${CN[rc]}${rv===0&&ri?' bt':''}" data-row="${rc}${rv}">${esc(label(rc,rv,P,1))}</th>`;
  cols.forEach(([c],ci)=>range(n).forEach(cv=>{if(!cc.includes(c)){h+=`<td class="void${rv===0&&ri?' bt':''}"></td>`;return;}const k=rc+rv+'|'+c+cv,m=ST.marks[k]||0;
   h+=`<td class="cell${m===1?' x':m===3?' x xa':m===2?' o':''}${cv===0&&ci>0?' bl':''}${rv===0&&ri>0?' bt':''}" data-k="${k}" data-r="${rc}${rv}" data-c="${c}${cv}" tabindex="0" role="button" aria-label="${esc(label(rc,rv,P,1))}, ${esc(label(c,cv,P,1))}">${m===1||m===3?'✕':m===2?'○':''}</td>`;}));
  h+='</tr>';}));
 return h+'</tbody></table></div>';}
function hilite(k){document.querySelectorAll('.lg .hl,.lg .hx').forEach(e=>e.classList.remove('hl','hx'));if(!k)return;const[r,c]=k.split('|');
 document.querySelectorAll(`.lg [data-row="${r}"],.lg [data-col="${c}"]`).forEach(e=>e.classList.add('hl'));
 document.querySelectorAll(`.lg td[data-r="${r}"],.lg td[data-c="${c}"]`).forEach(e=>e.classList.add('hx'));}
/* marks: 1=✕(직접) 2=○ 3=✕(○ 때문에 자동) — ○를 지우면 그 ○ 때문에 생긴 자동 ✕도 정리 */
function pruneAuto(){const rowO=new Set(),colO=new Set();for(const k in ST.marks)if(ST.marks[k]===2){const[a,b]=k.split('|');rowO.add(a+'|'+b[0]);colO.add(a[0]+'|'+b);}
 for(const k in ST.marks)if(ST.marks[k]===3){const[a,b]=k.split('|');if(!rowO.has(a+'|'+b[0])&&!colO.has(a[0]+'|'+b))delete ST.marks[k];}}
function setMark(k,m){const[a,b]=k.split('|');const rc=a[0],rv=a.slice(1),cc=b[0],cv=b.slice(1);const was=ST.marks[k]||0;
 if(m)ST.marks[k]=m;else delete ST.marks[k];
 if(m===2)for(let i=0;i<ST.P.n;i++){const k1=rc+rv+'|'+cc+i,k2=rc+i+'|'+cc+cv;if(String(i)!==cv&&!ST.marks[k1])ST.marks[k1]=3;if(String(i)!==rv&&!ST.marks[k2])ST.marks[k2]=3;}
 if(was===2&&m!==2)pruneAuto();}
function tap(k){const m=ST.marks[k]||0;if(ST.pen==='x')setMark(k,m===1||m===3?0:1);else setMark(k,m===2?0:2);}

  <details class="help"><summary>표 읽는 법</summary><p class="muted">✕는 불가능, ○는 확정, 빈칸은 아직 모르는 관계입니다. 위에서 ✕ 또는 ○를 고르고 칸을 누르세요. 같은 칸을 다시 누르면 표시가 지워집니다. ○를 표시하면 같은 줄의 빈칸에 ✕가 흐리게 채워지고, 그 ○를 지우면 함께 사라집니다.</p></details>
  ${gridHTML(P)}<div class="btns"><button class="btn" data-act="clear" ${ST.solved?'disabled':''}>표 지우기</button></div></details>`;
 if(ST.solved){const first=ST.rec&&(ST.rec.ms!==ST.ms||ST.rec.tries!==ST.tries)?ST.rec:null;
  h+=`<div class="card solved"><h2>장부 복원 완료</h2><p class="end">${esc(ending(P))}</p><div class="row"><div><b>${mmss(ST.ms)}</b>${first?'이번 풀이':'걸린 시간'}</div><div><b>${ST.tries}번</b>제출</div>${first?`<div><b>${mmss(first.ms)} · ${first.tries}번</b>처음 완료 기록</div>`:''}</div>
   <div class="btns">${ST.mode==='daily'?'<button class="btn lamp" data-act="share">결과 복사</button><button class="btn" data-act="replay">다시 풀기</button><button class="btn" data-act="back">다른 난이도</button>':''}<button class="btn" data-act="practice">연습 장부 한 판 더</button></div><p class="muted" id="sharemsg">${ST.mode==='daily'?'내일 0시(한국 시각)에 새 장부가 열립니다.':''}</p></div>`;}
 h+=`<div class="card final"><h2>점검 장부 <span class="pill2">최종 답 입력</span></h2><p class="muted">여기에서 고른 답만 채점됩니다. 추리 메모와 상세 추리표는 채점되지 않아요.</p>${ledgerHTML(P)}${ST.msg?`<div class="msg">${esc(ST.msg)}</div>`:''}${ST.solved?'':`<div class="btns"><button class="btn" data-act="fill">표의 ○로 채우기</button><button class="btn main" data-act="submit">제출하기</button></div>`}</div>`;
 return h;}
function render(){document.getElementById('today').textContent=koDate(TODAY);
 document.getElementById('app').innerHTML=ST.view==='play'&&ST.P?playHTML():selectHTML();if(ST.view==='play')hilite(ST.hl);}

function submit(){const P=ST.P,n=P.n;startClock();let wrong=0,empty=0;
 for(let p=0;p<n;p++)for(const c of['R','T','I']){const v=ST.ans[c+p];if(v===undefined||v==='')empty++;else if(+v!==P.sol[c][p])wrong++;}
 if(empty){ST.msg=`아직 비어 있는 칸이 ${empty}개 있습니다.`;return render();}
 ST.tries++;
 if(wrong){ST.msg=`${wrong}칸이 기록과 맞지 않습니다. 메모를 다시 대조해 보세요.`;save();return render();}
 ST.ms=elapsed();ST.t0=null;ST.solved=true;ST.msg='';if(!ST.rec&&ST.mode==='daily')ST.rec={ms:ST.ms,tries:ST.tries};save();render();}
function share(){const P=ST.P,no=dayNo(ST.date),r=ST.rec||{ms:ST.ms,tries:ST.tries};
 const t=`${D.title} ${no?'#'+String(no).padStart(3,'0'):koDate(ST.date)} · ${P.lv}단계 ${LVNAME[P.lv]} ${dots(P.lv)}\n🕯️ ${r.tries}번 만에 복원 · ${mmss(r.ms)}\n${D.url}`;
 const done=()=>{const m=document.getElementById('sharemsg');if(m)m.textContent='결과를 복사했습니다.';};
 if(navigator.clipboard)navigator.clipboard.writeText(t).then(done,()=>prompt('아래 내용을 복사하세요',t));else prompt('아래 내용을 복사하세요',t);}

document.addEventListener('click',e=>{const t=e.target;
 const cell=t.closest('.cell');if(cell){ST.hl=cell.dataset.k;if(ST.solved){hilite(ST.hl);return;}startClock();tap(cell.dataset.k);save();return render();}
 const pen=t.closest('[data-pen]');if(pen){ST.pen=pen.dataset.pen;uiSave({pen:ST.pen});return render();}
 const lv=t.closest('[data-lv]');if(lv)return openLevel(+lv.dataset.lv);
 const li=t.closest('li[data-c]');if(li){ST.done[li.dataset.c]=!ST.done[li.dataset.c];save();return render();}
 const b=t.closest('[data-act]');if(!b)return;
 switch(b.dataset.act){
  case'clear':if(confirm('표의 표시를 모두 지울까요?')){ST.marks={};save();render();}break;
  case'fill':for(let p=0;p<ST.P.n;p++)for(const c of['R','T','I'])for(let v=0;v<ST.P.n;v++)if(ST.marks['P'+p+'|'+c+v]===2)ST.ans[c+p]=v;save();render();break;
  case'submit':submit();break;
  case'share':share();break;
  case'replay':replay();break;
  case'back':toSelect();break;
  case'practice':startPractice();break;}});
document.addEventListener('toggle',e=>{const d=e.target;if(d.classList&&d.classList.contains('guide')){const tg=d.querySelector(':scope>summary .muted');if(tg)tg.textContent=d.open?'접기':'열기';return;}if(d.classList&&d.classList.contains('gridbox')){ST.gridOpen=d.open;const tg=d.querySelector(':scope>summary .muted');if(tg)tg.textContent=d.open?'접기':'상세 추리표 열기';return;}if(d.classList&&d.classList.contains('tale')){ST.intro=d.open;const tg=d.querySelector('.tg');if(tg)tg.textContent=d.open?'접기':'펼치기';save();}},true);
document.addEventListener('mouseover',e=>{const c=e.target.closest&&e.target.closest('.cell');if(c)hilite(c.dataset.k);});
document.addEventListener('mouseleave',()=>hilite(ST.hl));
document.addEventListener('focusin',e=>{const c=e.target.closest&&e.target.closest('.cell');if(c)hilite(c.dataset.k);});
document.addEventListener('keydown',e=>{const c=e.target.closest&&e.target.closest('.cell');if(c&&(e.key==='Enter'||e.key===' ')){e.preventDefault();c.click();return;}
 if(ST.view==='play'&&!/SELECT|INPUT|TEXTAREA/.test(e.target.tagName)&&(e.key==='x'||e.key==='X'||e.key==='o'||e.key==='O')){ST.pen=e.key.toLowerCase();uiSave({pen:ST.pen});render();}});
document.addEventListener('input',e=>{const t=e.target.closest&&e.target.closest('textarea[data-memo]');if(t){ST.memo[t.dataset.memo]=t.value;memoSave();}});
document.addEventListener('change',e=>{const s=e.target.closest('select[data-a]');if(s){startClock();ST.ans[s.dataset.a]=s.value;ST.msg='';save();}});
window.addEventListener('beforeunload',()=>{save();memoSave();});
/* 한국 시각 자정이 지나면 새 날짜로 */
function checkDay(){if(PREVIEW)return;const d=kstDate();if(d===TODAY)return;TODAY=d;
 if(ST.view==='select'){ST.date=d;render();}else{if(ST.mode==='daily'){ST.newDay=true;save();}render();}}
setInterval(checkDay,30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkDay();});
if(!D)document.getElementById('app').innerHTML='<p>inn-data.js 파일을 찾을 수 없습니다. 같은 폴더에 올려 주세요.</p>';else render();
</script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>마지막 접속자 — 출근 5분 후 사건 파일</title>
<style>
:root{--desk:#3d5764;--desk2:#365060;--win:#fff;--chrome:#eef1f3;--line:#d3d9de;--ink:#1d252b;--sub:#5f6d77;--xl:#1f6b47;--xlbg:#e7f1eb;--sel:#cde5d6;--mail:#2a5d8f;--amber:#c9822b;--bad:#b23b3b;--info:#fdf6d8;--shadow:0 6px 24px rgba(10,25,35,.28);color-scheme:light}
@media (prefers-color-scheme:dark){:root{--desk:#1f2d35;--desk2:#1a272e;--win:#1e2428;--chrome:#283035;--line:#3a454c;--ink:#e4e9ec;--sub:#9aa8b1;--xl:#4fb07f;--xlbg:#1f3329;--sel:#2c5a42;--mail:#7fb0e0;--bad:#e07a7a;--info:#3a3520;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.55 "Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",system-ui,sans-serif;color:var(--ink);background:var(--desk)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
[hidden]{display:none!important}
#app{height:100%;display:flex;flex-direction:column}
#bar{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:6px 12px;background:var(--desk2);color:#e8eef1;border-bottom:1px solid rgba(255,255,255,.08)}
#bar .who{font-weight:600;margin-right:auto}
#bar button{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:6px;padding:5px 11px;color:#e8eef1}
#clock{padding:3px 12px;border-radius:6px;background:rgba(0,0,0,.22);font-variant-numeric:tabular-nums}
#clock b{font-size:18px}
#nav{flex:none;display:flex;gap:4px;padding:8px 12px 0;overflow-x:auto}
#nav button{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);color:#eef3f5;border-radius:6px 6px 0 0;padding:6px 14px;white-space:nowrap}
#nav button.on{background:var(--win);color:var(--ink);font-weight:600}
#nav button.lock{opacity:.55}
#main{flex:1;min-height:0;display:grid;grid-template-columns:128px 1fr;gap:10px;padding:10px 12px 12px}
#icons{display:flex;flex-direction:column;gap:4px;overflow:auto}
.ico{background:none;border:1px solid transparent;border-radius:6px;color:#f2f6f8;padding:6px 4px;text-align:center;font-size:12px;line-height:1.3}
.ico span{display:block;font-size:26px;line-height:1.2}
.ico:hover,.ico.on{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25)}
.ico em{display:inline-block;margin-top:2px;font-style:normal;font-size:10.5px;background:var(--amber);color:#1b1205;border-radius:8px;padding:0 6px}
#winwrap{min-width:0;min-height:0;display:flex}
.empty{flex:1;display:grid;place-items:center;color:rgba(255,255,255,.6);text-align:center;padding:20px}
.pane{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--win);border-radius:8px;box-shadow:var(--shadow);overflow:hidden}
.tbar{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 12px;background:var(--chrome);border-bottom:1px solid var(--line);font-size:13px}
.tbar .t{margin-right:auto;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbar button{background:var(--win);border:1px solid var(--line);border-radius:5px;padding:2px 10px;font-size:12px}
.pbody{flex:1;overflow:auto;padding:14px 16px}
.pbody.flush{padding:0}
h3{margin:0 0 8px;font-size:15px}
p{margin:0 0 10px;max-width:72ch}
.muted{color:var(--sub);font-size:12.5px}
table.t{border-collapse:collapse;font-size:13px;margin:6px 0 10px}
table.t th,table.t td{border:1px solid var(--line);padding:5px 9px;text-align:left;vertical-align:top}
table.t th{background:var(--chrome);font-weight:600;white-space:nowrap}
.scroll{overflow-x:auto}
.tool{display:flex;flex-wrap:wrap;gap:6px;padding:6px 10px;border-bottom:1px solid var(--line);background:var(--xlbg);align-items:center;font-size:12.5px}
.tool button{background:var(--win);border:1px solid var(--line);border-radius:4px;padding:2px 9px}
.tool button.on{border-color:var(--xl);color:var(--xl);font-weight:600}
.msgbar{padding:6px 10px;background:var(--info);border-bottom:1px solid var(--line);font-size:12.5px}
.fbar{display:flex;align-items:center;gap:8px;padding:4px 10px;border-bottom:1px solid var(--line);font-size:13px;font-family:Consolas,"D2Coding",monospace;min-height:30px}
.fbar .addr{min-width:48px;padding:1px 6px;border:1px solid var(--line);border-radius:3px;text-align:center}
.fbar i{color:var(--sub)}
.cmt{margin:6px 10px;padding:6px 10px;background:#fff6c9;color:#3a3200;border:1px solid #e6d27a;border-radius:4px;font-size:13px;max-width:60ch}
.gwrap{overflow:auto}
table.grid{border-collapse:collapse;font-size:12.5px;table-layout:fixed}
table.grid th,table.grid td{border:1px solid var(--line);padding:3px 6px;height:26px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table.grid thead th,table.grid th.rh{background:var(--chrome);color:var(--sub);font-weight:400;text-align:center}
table.grid th.rh{width:34px}
table.grid td{cursor:cell}
table.grid td.hd{font-weight:600;background:var(--xlbg)}
table.grid td.sel{outline:2px solid var(--xl);outline-offset:-2px;background:var(--sel)}
table.grid td.bad{color:var(--bad)}
table.grid td.cm{position:relative}
table.grid td.cm::after{content:"";position:absolute;top:0;right:0;border:5px solid transparent;border-top-color:#d23;border-right-color:#d23}
table.grid .gapc{width:7px;min-width:7px;max-width:7px;padding:0;background:var(--chrome);border-left:3px double var(--sub);cursor:col-resize}
tr.gapr td,tr.gapr th{height:7px;padding:0;background:var(--chrome);border-top:3px double var(--sub)}
tr.gapr{cursor:row-resize}
.props{margin:10px;padding:10px 14px;border:1px solid var(--line);border-radius:6px;background:var(--chrome);font-size:13px;max-width:460px}
.props div{display:flex;gap:10px}.props div span:first-child{width:96px;flex:none;color:var(--sub)}
.split2{display:grid;grid-template-columns:minmax(200px,34%) 1fr;height:100%}
.list{border-right:1px solid var(--line);overflow:auto}
.list button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:8px 12px}
.list button.on{background:var(--xlbg)}
.list button.unread b{color:var(--mail)}
.list small{display:block;color:var(--sub);font-size:11.5px}
.mbody{overflow:auto;padding:14px 18px;white-space:pre-wrap}
.mbody .mh{white-space:normal;border-bottom:1px solid var(--line);margin-bottom:10px;padding-bottom:8px}
.chat{display:flex;flex-direction:column;gap:6px;padding:14px 16px;overflow:auto}
.bub{max-width:80%;padding:7px 11px;border-radius:12px;background:var(--chrome)}
.bub.me{align-self:flex-end;background:var(--xlbg)}
.bub small{display:block;color:var(--sub);font-size:11px}
.files button{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 14px}
.files button:hover{background:var(--chrome)}
.files small{color:var(--sub);font-size:12px}
.tag{font-size:11px;background:var(--amber);color:#1b1205;border-radius:8px;padding:0 7px;white-space:nowrap}
.pw{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.pw input{padding:7px 9px;border:1px solid var(--line);border-radius:5px;background:var(--win);color:var(--ink);font:inherit;min-width:180px}
.btn{background:var(--win);border:1px solid var(--line);border-radius:6px;padding:6px 12px}
.btn:hover{border-color:var(--xl)}
.btn.main{background:var(--xl);border-color:var(--xl);color:#fff}
.err{color:var(--bad);font-size:13px}
.screen{border-radius:6px;background:#12303a;color:#d9ecef;max-width:520px;overflow:hidden}
.screen .sc{padding:14px 16px;min-height:180px}
.screen .task{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;background:#0b2028;font-size:12.5px}
.screen .task b{font-size:13px;text-align:right;line-height:1.3;font-variant-numeric:tabular-nums}
.screen .rf{margin-top:10px;font-size:13px}.screen .rf div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #24485a;padding:4px 0}
.sticker{display:inline-block;margin:6px 0 12px;padding:6px 10px;background:#fbf3c4;color:#3a3200;border-radius:3px;font-size:12.5px;transform:rotate(-1deg)}
.slide{border:1px solid var(--line);border-radius:6px;padding:16px 18px;margin:0 0 12px;max-width:560px;background:var(--win)}
.slide h4{margin:0 0 8px;font-size:15px}
.slide .no{float:right;color:var(--sub);font-size:12px}
.slide ul{margin:0;padding-left:18px}
.panel{max-width:520px;border-radius:8px;background:#1b2a31;color:#e3edf0;padding:16px}
.panel .row{display:flex;gap:12px;padding:6px 0;border-bottom:1px solid #2f444e}
.panel .row b{min-width:118px;flex:none;white-space:nowrap;font-variant-numeric:tabular-nums}
.panel button{margin-top:10px;background:#2f444e;border:0;border-radius:5px;padding:5px 12px;color:#e3edf0}
#toasts{position:fixed;right:14px;bottom:14px;display:flex;flex-direction:column;gap:8px;z-index:30;max-width:360px}
.toast{background:var(--win);color:var(--ink);border-left:4px solid var(--xl);border-radius:6px;padding:9px 12px;box-shadow:var(--shadow);font-size:13.5px;animation:tin .25s ease-out}
.toast.ev{border-left-color:var(--amber)}
.toast b{display:block;font-size:12px;color:var(--sub)}
@keyframes tin{from{transform:translateY(8px);opacity:0}}
#modal{position:fixed;inset:0;background:rgba(8,18,24,.6);display:grid;place-items:center;z-index:40;padding:16px}
.mbox{background:var(--win);color:var(--ink);border-radius:10px;box-shadow:var(--shadow);width:min(640px,100%);max-height:90vh;overflow:auto;padding:22px 24px}
.mbox h2{margin:0 0 12px;font-size:20px}
.mtabs{display:flex;gap:4px;margin-bottom:12px}
.mtabs button{background:var(--chrome);border:1px solid var(--line);border-radius:5px;padding:4px 12px}
.mtabs button.on{border-color:var(--xl);color:var(--xl);font-weight:600}
.cards{margin:0;padding-left:18px}.cards li{margin:0 0 6px}
textarea{width:100%;min-height:220px;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--win);color:var(--ink);font:inherit;line-height:1.6}
.hint{border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin:0 0 10px}
.hint ol{margin:6px 0;padding-left:20px}
.intro{width:min(560px,100%);background:var(--win);border-radius:10px;padding:30px 32px;box-shadow:var(--shadow)}
.intro h1{margin:0 0 2px;font-size:30px;letter-spacing:-.5px}
.intro .ep{color:var(--sub);margin-bottom:18px}
.intro p{font-size:15px}
.intro .btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
#guide{margin:8px 12px 0;padding:8px 12px;border-radius:6px;background:var(--info);color:var(--ink);border:1px solid var(--line);font-size:13.5px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
#guide b{color:var(--amber)}#guide .gx{margin-left:auto;background:none;border:1px solid var(--line);border-radius:5px;padding:1px 9px;font-size:12px}
.brief{margin:0 0 14px;padding-left:18px}.brief li{margin:0 0 5px}
.box{border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin:0 0 12px;background:var(--chrome)}
.box h4{margin:0 0 6px;font-size:13.5px;color:var(--sub);font-weight:600}
.steps{list-style:none;margin:0;padding:0}.steps li{margin:0 0 4px}.steps .ok{color:var(--xl)}
/* ---- 가독성 보정: 본문 15~16px, 넓은 화면에서 작아 보이지 않게 ---- */
body{font-size:15.5px}
#main{width:100%;max-width:1320px;margin:0 auto;grid-template-columns:160px 1fr}
#nav{width:100%;max-width:1320px;margin:0 auto}
#guide{max-width:1296px;margin:8px auto 0;width:calc(100% - 24px)}
#bar{font-size:14.5px}#bar button{padding:6px 12px}
.ico{font-size:13.5px;padding:8px 4px}.ico span{font-size:30px}
.tbar{font-size:14.5px}.tbar button{font-size:13px;padding:4px 12px}
.pbody{padding:18px 22px}
p{max-width:76ch}.muted{font-size:13.5px}
table.t{font-size:14.5px}table.t th,table.t td{padding:6px 10px}
table.grid{font-size:14px}table.grid th,table.grid td{height:30px}
.tool,.msgbar{font-size:14px}.tool button{padding:4px 11px}
.fbar{font-size:14.5px}.cmt{font-size:14.5px}
.props{font-size:14.5px;max-width:540px}.props div span:first-child{width:110px}
.list button{padding:10px 14px}.list small{font-size:13px}
.mbody{font-size:15.5px;line-height:1.7;max-width:820px}
.chat{font-size:15px}.bub{max-width:min(80%,620px);padding:9px 13px}.bub small{font-size:12px}
.files button{padding:12px 16px;font-size:15px}.files small{font-size:13px}
.screen{max-width:600px}.screen .task{font-size:13.5px}.screen .rf{font-size:14.5px}
.slide{max-width:640px}.panel{max-width:600px}.panel .row{font-size:14.5px}
.toast{font-size:14.5px}.mbox{font-size:15px}
@media (min-width:1500px){body{font-size:16px}.mbody,.files button{font-size:16px}table.t,table.grid{font-size:15px}}
@media (max-width:760px){#main{grid-template-columns:1fr}.pbody{padding:14px 14px}.ico{min-width:84px}#bar button{padding:6px 10px;font-size:13.5px}}
/* ---- 메인으로 버튼(공통 규격: 최소 44×44) ---- */
.home-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;padding:0 14px;border-radius:10px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.12);color:#eef3f5;font-weight:700;font-size:14px;text-decoration:none;white-space:nowrap}
.home-btn svg{width:18px;height:18px;flex:none}.home-btn:hover{background:rgba(255,255,255,.2)}
/* ---- 팀장님 지나갈 때(위장 화면) ---- */
#boss{position:fixed;inset:0;z-index:90;background:#fff;color:#222;display:grid;grid-template-rows:auto auto auto 1fr auto;font:13px/1.4 "Segoe UI","Malgun Gothic",system-ui,sans-serif}
#boss .bbar{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#217346;color:#fff;padding:6px 12px}
#boss .bbar button{border:1px solid rgba(255,255,255,.4);background:transparent;color:#fff;border-radius:5px;padding:4px 10px;font-size:12px;min-height:36px}
#boss .bmenu{display:flex;gap:16px;padding:6px 12px;border-bottom:1px solid #d4d4d4}
#boss .bfx{display:flex;gap:10px;padding:4px 12px;border-bottom:1px solid #d4d4d4}#boss .bfx b{min-width:48px;border:1px solid #d4d4d4;text-align:center;font-weight:400}
#boss .bgrid{overflow:auto}#boss table{border-collapse:collapse}
#boss th,#boss td{border:1px solid #d4d4d4;padding:3px 10px;min-width:90px;height:24px;text-align:right;white-space:nowrap}
#boss th{background:#f3f3f3;font-weight:400;text-align:center;min-width:36px;color:#555}#boss td.l{text-align:left}
#boss .btabs{display:flex;gap:2px;padding:4px 12px;background:#f3f3f3;border-top:1px solid #d4d4d4}#boss .btabs span{padding:2px 12px}#boss .btabs .on{background:#fff;border-bottom:2px solid #217346}
/* 오프닝 */
#op{position:fixed;inset:0;z-index:50;background:#060b0e;color:#cfd8dc;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;cursor:pointer;user-select:none;padding:20px}
#op .mon{width:min(300px,70vw);aspect-ratio:16/10;border:6px solid #1c2429;border-radius:6px;background:#0d1a20;position:relative;transition:background .6s,box-shadow .6s}
#op .mon.lit{background:#9fc4d3;box-shadow:0 0 80px 10px rgba(120,180,205,.25)}
#op .mon .cur{position:absolute;left:14%;top:30%;width:44%;height:8px;background:#38606f;box-shadow:0 18px 0 #38606f,0 36px 0 #38606f}
#op .mon .cur::after{content:"";position:absolute;right:-12px;top:36px;width:8px;height:12px;background:#0d1a20;animation:blink 1s steps(1) infinite}
#op .mon .file{position:absolute;inset:18% 10%;background:#f4f7f8;color:#1d252b;font-size:12px;padding:8px;border-radius:3px;line-height:1.5}
#op .cap{max-width:30em;text-align:center;font-size:16px;line-height:1.7;min-height:3.4em;word-break:keep-all}
#op .panel4{width:min(520px,100%);border:2px solid #2c3b43;border-radius:10px;background:#0a1216;padding:14px 16px 16px;display:flex;flex-direction:column;align-items:center;gap:16px}
#op .lab{align-self:flex-start;font-size:12px;letter-spacing:.08em;color:#8fa6af;border:1px solid #2c3b43;border-radius:99px;padding:1px 10px}
#op .scn{position:relative;min-height:200px;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
#op .office{display:flex;align-items:flex-end;gap:10px}
#op .office .dm{width:46px;height:32px;border:4px solid #1c2429;border-radius:3px;background:#0d1a20}
#op .office .room{border:2px dashed #34474f;border-radius:6px;padding:8px 10px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:#8fa6af}
#op .mon.sm{width:90px;border-width:4px}
#op .sil{position:absolute;bottom:-6px;left:50%;width:150px;height:96px;transform:translateX(-50%);background:radial-gradient(circle at 50% 30%,#05090b 0 26px,transparent 27px),radial-gradient(ellipse 75px 46px at 50% 100%,#05090b 98%,transparent 100%);filter:blur(1.5px)}
#op .list{position:absolute;inset:12% 7%;background:#f4f7f8;color:#1d252b;border-radius:3px;padding:6px 8px;font-size:11px;line-height:1.6;display:flex;flex-direction:column;text-align:left}
#op .list em{font-style:normal;font-size:9.5px;background:#c9822b;color:#1b1205;border-radius:6px;padding:0 4px}
#op .time{font-size:26px;letter-spacing:2px;font-variant-numeric:tabular-nums}
#op .ctl{position:absolute;bottom:18px;right:18px;display:flex;gap:8px}
#op .ctl button{background:transparent;border:1px solid #4a5a62;color:#cfd8dc;border-radius:5px;padding:4px 12px}
#op .step{position:absolute;bottom:22px;left:20px;font-size:12px;color:#6f8088}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}#op .mon{transition:none}#op .mon .cur::after{animation:none}}
@media (max-width:760px){#main{grid-template-columns:1fr;grid-template-rows:auto 1fr;padding:8px}#icons{flex-direction:row;overflow-x:auto}.ico{min-width:78px}.split2{grid-template-columns:1fr;grid-template-rows:minmax(110px,38%) 1fr}.list{border-right:0;border-bottom:1px solid var(--line)}#bar .who{width:100%}table.grid .gapc{width:12px;min-width:12px;max-width:12px}tr.gapr td,tr.gapr th{height:12px}#toasts{left:10px;right:10px;max-width:none}}
</style>
</head>
<body>
<div id="op" hidden></div>
<div id="app" hidden>
  <header id="bar">
    <span class="who">강이안 · 전략분석팀</span>
    <div id="clock"></div>
    <button data-act="brief">사건 개요</button>
    <button data-act="goal">조사 목표</button>
    <button data-act="note">수첩</button>
    <button data-act="hint">힌트</button>
    <button data-act="title">메뉴</button>
    <button data-act="boss" title="Esc 키로도 전환돼요">🙈 팀장님 지나갈 때</button>
    <a class="home-btn" href="./" data-home><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5.5 10v9.5h5v-5.5h3v5.5h5V10" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></svg><span>메인으로</span></a>
  </header>
  <nav id="nav"></nav>
  <div id="guide" hidden></div>
  <main id="main"><div id="icons"></div><div id="winwrap"></div></main>
</div>
<div id="modal" hidden></div>

 $('#clock').innerHTML=`${NOW.date} <b>${NOW.time}</b>`;guideRender();
 $('#nav').innerHTML=Object.entries(PLACES).map(([k,p])=>`<button data-act="go" data-id="${k}" class="${S.place===k?'on':''}${p.locked?' lock':''}">${p.name}${p.locked?' · 준비 중':''}</button>`).join('');
 const P=PLACES[S.place];
 if(P.locked){$('#icons').innerHTML='';$('#winwrap').innerHTML=`<div class="empty">${P.name}은(는) 아직 제작 중인 장소입니다.<br>현재 공개 버전에서는 내 자리와 회의실 2를 조사할 수 있고,<br>복사실·로비 조사와 최종 보고서 제출, 결말은 다음 업데이트에서 추가됩니다.</div>`;return;}
 $('#icons').innerHTML=P.items.map(id=>{const it=ITEMS[id];const nw=id==='folder'&&!S.f.seenFolder?'<em>새 파일</em>':id==='mail'&&MAILS.some(m=>!S.read.includes(m.id))?'<em>안 읽음</em>':'';
  const on=S.win===id||(WIN[S.win]&&WIN[S.win].back===id);return `<button class="ico${on?' on':''}" data-act="open" data-id="${id}"><span>${it.icon}</span>${it.label}${nw?'<br>'+nw:''}</button>`;}).join('');

 if(!W||!(P.items.includes(S.win)||P.items.includes(W.back))){$('#winwrap').innerHTML=`<div class="empty">${S.place==='desk'?'왼쪽에서 조사할 것을 고르세요.':'회의실 2. 주말 동안 아무도 쓰지 않은 듯 조용하다.'}<br><span style="font-size:12.5px">시간 제한은 없습니다. 천천히 살펴보세요.</span></div>`;return;}

function openWin(id){
 S.win=id;
 if(id==='folder'&&!S.f.seenFolder){S.f.seenFolder=1;card('newfile');}
 if(id==='copyx')once('copy',()=>say('작성자 강이안. 하지만 나는 이 파일을 만든 적이 없다.'));
 if(id==='ledger'){S.ltab=S.ltab||'main';if(S.ltab==='main')card('ledger');}
 if(id==='sticker')card('sticker');
 if(id==='roompc'){card('roomsess');card('roomclk');card('recent');once('roompc',()=>say('주말 내내 내 계정이 이 PC에 열려 있었다.'));}
 if(id==='handout')card('slide');
 if(id==='chat'&&S.chat){const c=CHATS[S.chat];if(c.card)card(c.card);}
}
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-act]');if(!el)return;
 const act=el.dataset.act,id=el.dataset.id;
 switch(act){
  case'start':beginGame();return;
  case'bstart':closeModal();setTimeout(()=>toast('구재하','이안 씨, 금요일에 확인해 주신 대로 9시 반에 초기화 진행합니다.',1),700);return;
  case'brief':modal(briefHTML(0));return;
  case'goal':modal(goalHTML());return;
  case'gdone':S.f.gdone=1;break;
  case'resume':closeModal();$('#app').hidden=false;render();return;
  case'reset':if(confirm('저장된 조사 기록과 메모를 지우고 처음부터 시작할까요?')){S=fresh();save();opStart();}return;
  case'replay':opStart();return;
  case'title':titleScreen();return;
  case'boss':save();toggleBoss();return;
  case'go':S.place=id;if(id==='room')once('room',()=>say('회의실 2. 금요일에 내가 앉았던 자리다.'));break;
  case'open':openWin(id);break;
  case'close':S.win=null;break;
  case'oldfile':say('지난달 분석 보고서다. 금요일 이후로 바뀐 것은 없다.');return;
  case'mail':{S.mail=id;if(!S.read.includes(id))S.read.push(id);const m=MAILS.find(x=>x.id===id);(m.cards||[]).forEach(card);break;}
  case'chat':S.chat=id;if(CHATS[id].card)card(CHATS[id].card);break;
  case'props':S.f.showProps=!S.f.showProps;if(S.f.showProps){card('props');once('props',()=>say('금요일 18시 10분. 그때 나는 이 회의실 2 PC로 화면을 공유하고 있었다.'));}break;
  case'links':S.f.showLinks=!S.f.showLinks;if(S.f.showLinks)card('link');break;
  case'zipprops':S.f.zipProps=!S.f.zipProps;if(S.f.zipProps)card('zipprops');break;
  case'unrow':S.f.row17=1;card('row17');once('row17',()=>say('EQ-1217. 내 노트북이다. 오늘 9시 30분에 초기화?'));break;
  case'uncol':S.f.colG=1;once('colg',()=>say('숨겨진 열이 있었다. "확인 메모".'));break;
  case'cell':{const d=el.dataset.doc,a=el.dataset.a;S.sel[d]=a;
   if(d==='copy'){const m=a.match(/^([A-Z])(\d+)$/),c=m[1],r=+m[2];
    if(a==='A17')card('cmt17');
    if(a==='D17')card('fx17');
    if(a==='G9')card('g9');
    if('DEH'.includes(c)&&r>1&&r!==17)card('fx');}
   break;}
  case'pw':{const v=($('#pwin').value||'').toUpperCase().replace(/[\s-]/g,'');
   if(v==='EQ0917'||v==='0917'){S.f.zip=1;card('log');say('시연 기록이다. 서른 줄.');}else{$('#pwerr').textContent='비밀번호가 올바르지 않습니다. 횟수 제한은 없습니다.';return;}break;}
  case'ltab':S.ltab=id;if(id==='log'){card('ledgerlog');once('llog',()=>say('금요일 20시 14분, 변경자 강이안. 그 시간에 나는 집에 있었다.'));}else card('ledger');break;
  case'past':S.f.past=1;card('resv');break;
  case'note':modal(noteHTML());return;
  case'ntab':S.ntab=id;save();modal(noteHTML());return;
  case'hint':modal(hintHTML());return;
  case'hopen':S.hints[+id]=Math.min(3,S.hints[+id]+1);save();modal(hintHTML());return;
  case'mclose':closeModal();if(!S.started)titleScreen();return;
 }
 save();render();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(!$('#boss').hidden||($('#modal').hidden&&$('#op').hidden&&S.started))){e.preventDefault();save();toggleBoss();return;}if(e.key==='Enter'&&e.target.id==='pwin'){e.preventDefault();$('[data-act="pw"]').click();}if(e.key==='Escape'&&!$('#modal').hidden&&S.started)closeModal();});
document.addEventListener('click',e=>{if(e.target.closest('[data-home]'))save();},true);
document.addEventListener('input',e=>{if(e.target.id==='memo'){S.memo=e.target.value;save();}});

/* ===== 시작 ===== */
if(!S.opSeen)opStart();else titleScreen();
</script>
</body>
</html>

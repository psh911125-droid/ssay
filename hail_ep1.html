function grid(doc,cols,max,fn,hidR,hidC){
 const sel=S.sel[doc];let fv='',cm='';
 if(sel){const m=sel.match(/^([A-Z])(\d+)$/);const c=fn(+m[2],m[1])||{};fv=c.f||c.v||'';cm=c.cm||'';}
 let h=`<div class="fbar"><span class="addr">${sel||''}</span><i>fx</i><span>${esc(fv)}</span></div>`;
 if(cm)h+=`<div class="cmt">💬 메모: ${esc(cm)}</div>`;
 h+='<div class="gwrap"><table class="grid"><thead><tr><th class="rh"></th>';
 cols.forEach(([k,w])=>{h+=hidC.includes(k)?`<th class="gapc" data-act="uncol" title="열 숨기기 취소"></th>`:`<th style="width:${w}px">${k}</th>`;});
 h+='</tr></thead><tbody>';
 for(let r=1;r<=max;r++){
  if(hidR.includes(r)){h+=`<tr class="gapr" data-act="unrow" title="행 숨기기 취소"><th></th>${cols.map(()=>'<td></td>').join('')}</tr>`;continue;}
  h+=`<tr><th class="rh">${r}</th>`;
  cols.forEach(([k])=>{if(hidC.includes(k)){h+='<td class="gapc"></td>';return;}const c=fn(r,k)||{v:''},a=k+r;
   h+=`<td data-act="cell" data-doc="${doc}" data-a="${a}" class="${c.hd?'hd':''}${sel===a?' sel':''}${c.cm?' cm':''}${c.v==='폐기'?' bad':''}">${esc(c.v)}</td>`;});
  h+='</tr>';}
 return h+'</tbody></table></div>';}

const Q3=['헤일이 회의 중에 실수로 저장했다','회의실 2 PC 시계가 1시간 느리다','주말 서버 점검 때 시각이 바뀌었다','누군가 파일 정보를 직접 고쳤다'];
const Q4=['EQ-0917','EQ-1217','EQ-1102','EQ-0955'];
const CATS=[['누가 언제 건물에 있었는지',['gate']],['파일 시각을 바로 읽는 근거',['it','roompc']],['공식 대장이 바뀐 기록',['ledgerlog']],['19시대 동선',['copier','dcopy']],['20시대 동선',['parcel','dlobby']],['그 장비를 지켜야 하는 이유',['meeting']]];
function sel(id,opts){return `<select id="${id}"><option value="">선택</option>${opts.map(o=>`<option ${S.rep[id]===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`;}
function reportModal(msg){modal(`<h2>📝 초기화 보류 요청서</h2><p class="muted">받는 사람: 구재하 과장(장비 관리대장 책임자)</p>
 <label>1. 헤일 계정으로 사본(경고 파일)을 만든 사람</label>${sel('q1',NAMES)}
 <label>2. 헤일 계정으로 공식 대장을 바꾸고 승인 메시지를 보낸 사람</label>${sel('q2',NAMES)}
 <label>3. 사본 파일이 18:10에 만들어진 것처럼 보인 이유</label>${sel('q3',Q3)}
 <label>4. 초기화를 멈춰야 할 장비</label>${sel('q4',Q4)}
 <label>5. 근거 문서 첨부</label>${S.cards.size?[...S.cards].map(c=>`<label class="chk"><input type="checkbox" value="${c}" ${S.rep.att&&S.rep.att.includes(c)?'checked':''}> ${esc(CARD[c])}</label>`).join(''):'<p class="muted">증거함이 비어 있습니다.</p>'}
 ${msg?`<div class="say"><b>구재하</b><br>${esc(msg)}</div>`:''}
 <div class="btns"><button class="btn main" data-act="submit">제출하기</button><button class="btn" data-act="mclose">닫기</button></div>`);}
function submit(){['q1','q2','q3','q4'].forEach(k=>S.rep[k]=$('#'+k).value);S.rep.att=[...document.querySelectorAll('.mbox input[type=checkbox]:checked')].map(x=>x.value);tick(1);
 const ans={q1:'서민재',q2:'차서윤',q3:Q3[1],q4:'EQ-0917'};const wrong=Object.keys(ans).filter(k=>S.rep[k]!==ans[k]).length;
 if(wrong)return reportModal(`적어 주신 것 중 ${wrong}개는 기록이랑 안 맞는 것 같아요. 규정상 이대로는 못 멈춥니다.`);
 const miss=CATS.filter(([,ids])=>!ids.some(i=>S.rep.att.includes(i))).map(c=>c[0]);
 if(miss.length)return reportModal(`내용은 맞는 것 같은데 근거가 빠졌어요. 필요한 것: ${miss.join(', ')}.`);
 ending();}
const END=[
 [['구재하',`…근거 문서가 다 붙어 있네요. 규정상 막을 이유가 없습니다. EQ-0917 초기화 보류합니다.`],['구재하','지금 9시 '+'%M%'+'분. 아슬아슬했어요.']],
 [['','EQ-0917의 원본 실행 로그가 열린다.'],['서민재','시연 대상 30건. 성공 18건.'],['헤일','보고서엔 29건이었는데요.']],
 [['서민재','금요일 7시쯤 회의실에 다시 갔습니다. 헤일 씨 계정이 열려 있더군요.'],['서민재','신고하면 차 팀장님께 바로 전달되는 구조라서, 헤일 씨가 직접 보게 만들고 싶었습니다.'],['서민재','17행은 제가 넣었습니다. 놀라게 해서 죄송합니다. 허락 없이 계정을 쓴 건 제 잘못입니다. 책임지겠습니다.']],
 [['차서윤','…헤일 씨 계정이 열려 있었어요.'],['차서윤','그 숫자 하나만 없으면 될 것 같았어요.']],
 [['헤일','다음부터 회의 끝나면 로그아웃부터 할게요.'],['구재하','규정상 그게 맞습니다.'],['헤일','…근데 제 노트북은 진짜 안 지우는 거죠?']],
 [['서민재','헤일 씨. 원본 로그에 이상한 게 하나 더 있었습니다.'],['서민재','그건… 다음에 말씀드리죠.']]];
function ending(i=0){if(i>=END.length){const sec=Math.round((Date.now()-S.t0)/1000);return modal(`<h2>사건 해결</h2><p>「18시 10분의 헤일」을 해결했습니다.</p><table class="t"><tr><th>플레이 시간</th><td>${Math.floor(sec/60)}분 ${sec%60}초</td></tr><tr><th>게임 속 시각</th><td>${hm(S.t)}</td></tr><tr><th>힌트 사용</th><td>${S.hints}회</td></tr><tr><th>모은 증거</th><td>${S.cards.size}개</td></tr></table><div class="btns"><button class="btn" data-act="mclose">조사 화면으로 돌아가기</button></div>`);}
 modal(END[i].map(([w,t])=>`<p class="line">${w?`<b>${w}</b> `:''}${esc(t.replace('%M%',String(S.t%60).padStart(2,'0')))}</p>`).join('')+`<div class="btns"><button class="btn main" data-act="end" data-i="${i+1}">다음</button></div>`);}

/* ===== 대화 ===== */
function addLog(w,t){(S.log[S.who]=S.log[S.who]||[]).push([w,t]);}
function ask(tid){const p=PEOPLE[S.who],t=p.topics.find(x=>x.id===tid);const first=!S.asked[S.who+tid];S.asked[S.who+tid]=1;tick(1);addLog('헤일',t.q);
 if(t.stmt){S.stmt[S.who]=t.stmt;const st=STMT[t.stmt];if(st.card)card(st.card,1);return render();}
 t.a.forEach(x=>addLog(p.name,x));if(t.after)addLog(t.after[0],t.after[1]);
 if(t.give)t.give.forEach(c=>card(c));
 if(t.flag==='gate'&&first){S.f.gate=1;toast('바탕화면','"출입 기록"이 추가되었습니다.');}
 render();if(t.act==='report')reportModal();}
function presentModal(sid){modal(`<h2>증거 제시</h2><p>"${esc(STMT[sid].text)}"</p>${[...S.cards].map(c=>`<div class="btns" style="margin:4px 0"><button class="btn" data-act="pick" data-s="${sid}" data-id="${c}">${esc(CARD[c])}</button></div>`).join('')||'<p class="muted">제시할 증거가 없습니다.</p>'}<div class="btns"><button class="btn" data-act="mclose">취소</button></div>`);}
function pick(sid,c){closeModal();const st=STMT[sid],p=PEOPLE[st.who];tick(1);
 if(c!==st.ok){addLog(p.name,RETORT[st.who]);return render();}
 addLog(st.hit[0],st.hit[1]);
 if(st.next){S.stmt[st.who]=st.next;}else{delete S.stmt[st.who];}
 if(st.broke){S.f[st.broke]=1;(st.after||[]).forEach(([w,t])=>addLog(w,t));}
 render();}

/* ===== 이벤트 ===== */
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act,id=el.dataset.id;
 switch(a){
 case'start':$('#app').hidden=false;closeModal();S.t0=Date.now();render();setTimeout(()=>toast('구재하','헤일 씨, 금요일에 확인해 주신 대로 9시 반에 진행할게요.',1),900);break;
 case'open':openDoc(id);break;
 case'focus':S.prev=S.focus;S.focus=id;render();break;
 case'close':S.open=S.open.filter(x=>x!==id);if(S.focus===id)S.focus=S.prev&&S.open.includes(S.prev)?S.prev:S.open[S.open.length-1]||null;if(S.prev===id||S.prev===S.focus)S.prev=S.open.filter(x=>x!==S.focus).pop()||null;render();break;
 case'split':S.split=!S.split;if(!S.prev||S.prev===S.focus)S.prev=S.open.filter(x=>x!==S.focus).pop()||null;render();break;
 case'pin':card(id);render();break;
 case'cell':{S.sel[el.dataset.doc]=el.dataset.a;if(el.dataset.doc==='copy'){const m=el.dataset.a.match(/^([A-Z])(\d+)$/),c=copyCell(+m[2],m[1]);
  if(c&&c.f)once('o_fx',()=>{card('formula');say('이 칸은 직접 쓴 게 아니야. 공식 관리대장 값을 그대로 끌어오고 있어.');});
  if(c&&!c.f&&+m[2]===17&&'DEH'.includes(m[1])&&S.cards.has('formula'))once('o_fx17',()=>say('그런데 17행은 직접 입력돼 있네. 공식 대장엔 이 줄이 없다는 뜻인가?'));}
  render();break;}
 case'unrow':S.f.row17=1;tick(1);card('row17');say('17행… 내 노트북이 왜 여기 있어? 9시 30분 초기화?');render();break;
 case'uncol':S.f.colG=1;tick(1);say('"확인 메모"… 누군가 나한테 뭘 보라고 하는 것 같아.');render();break;
 case'props':S.f.showProps=!S.f.showProps;if(S.f.showProps){card('props');once('o_props',()=>say('18시 10분… 그때 나, 회의실에서 바로 그 PC로 화면 공유하고 있었는데. 설마 내가 만든 거야?'));}render();break;
 case'pw':{const v=($('#pwin').value||'').toUpperCase().replace(/[\s-]/g,'');tick(1);if(v==='EQ0917'){S.f.ledger=1;render();say('공식 대장엔 17행이 없어. 그런데 EQ-0917을 폐기로 바꾼 사람이… 나?');}else{render();$('#pwmsg').textContent='암호가 맞지 않습니다.';}break;}
 case'sheet':S.sheet=el.dataset.s;render();break;
 case'mail':S.mail=id;if(!S.read.has(id)){S.read.add(id);tick(1);}render();break;
 case'chat':S.chat=id;if(id==='jaeha')once('o_msg',()=>say('금요일 8시 16분에 내가 보냈다고? 그 시간엔 집에서 드라마 보고 있었는데.'));render();break;
 case'nope':toast('공유 폴더','이 폴더에 접근할 권한이 없습니다.');break;
 case'logout':S.f.logout=1;say('늦었지만… 로그아웃.');render();break;
 case'who':S.who=id;render();break;
 case'ask':ask(id);break;
 case'present':presentModal(id);break;
 case'pick':pick(el.dataset.s,id);break;
 case'hint':hintModal();break;
 case'hintnext':{const s=stage();S.hl[s]=(S.hl[s]||0)+1;S.hints++;hintModal();break;}
 case'cards':cardsModal();break;
 case'submit':submit();break;
 case'end':ending(+el.dataset.i);break;
 case'mclose':closeModal();render();break;}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='pwin')$('[data-act=pw]').click();if(e.key==='Escape'&&!$('#modal').hidden&&$('#app').hidden===false&&!$('.intro'))closeModal();});

$('#modal').innerHTML=`<div class="intro"><h1>18시 10분의 헤일</h1><div class="ep">퇴근 5분 전: 사건 파일 · 정식 1화</div><p>월요일 아침 8시 47분.
출근하자마자 바탕화면에 처음 보는 파일이 있다.
작성자는 나, 헤일. 나는 이 파일을 만든 적이 없다.

그리고 9시 30분, 무언가가 지워진다.</p><div class="btns"><button class="btn main" data-act="start">출근하기</button></div><p class="muted">PC 화면에 맞춰 만들었습니다. 막히면 상단의 💡 힌트를 쓰세요.</p></div>`;
</script>
</body>
</html>
